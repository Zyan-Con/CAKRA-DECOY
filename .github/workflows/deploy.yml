name: deploy

# Jalan setelah workflow "ci" selesai di branch main DAN lolos.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            ubuntu@"$SERVER_HOST" '
              set -euo pipefail
              cd ~/CAKRA-DECOY
              git pull --ff-only
              docker compose up -d --build
              # caddy bind-mount file tunggal: recreate biar Caddyfile baru kebaca (inode replace)
              docker compose up -d --force-recreate caddy
              docker image prune -f
              sleep 5
              curl -fsS http://127.0.0.1:8181/health
            '
